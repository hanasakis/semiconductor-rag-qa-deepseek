version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: fabyield-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fabyield-app
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-deepseek-r1:8b}
      - APP_ENV=${APP_ENV:-dev}
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./chroma_db:/app/chroma_db
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  ollama_data:
